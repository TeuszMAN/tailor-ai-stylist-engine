name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check app tests scripts

      - name: Ruff (format)
        run: ruff format --check app tests scripts

      - name: Mypy (strict)
        run: mypy app scripts

      - name: Pytest (includes the contract drift guard)
        run: pytest

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t tailor-ai-engine:ci .

      - name: Run container and probe the API
        run: |
          docker run -d --name engine -p 8000:8000 tailor-ai-engine:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs engine; exit 1; fi
            sleep 1
          done
          curl -fsS -X POST http://localhost:8000/api/v1/fit-finder \
            -H 'content-type: application/json' \
            -d '{"height_cm":180,"weight_kg":85,"chest_type":"medio","belly_type":"medio"}' | grep -q '"suit_size":52'
          curl -fsS -X POST http://localhost:8000/api/v1/stylist/recommend \
            -H 'content-type: application/json' \
            -d '{"message":"Sou padrinho de casamento à tarde, tenho 1,80 m e 85 kg"}' | grep -q '"recommended_looks":\[{'
          test "$(docker inspect --format '{{.Config.User}}' engine)" = "engine"

      - name: Stop container
        if: always()
        run: docker rm -f engine || true
